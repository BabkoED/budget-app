/* ── CALENDAR POPUP ──────────────────────────── */
/* ── Выбор дня: выпадает под чипом даты ── */
function rCalPop(){
  var now=new Date(),y=now.getFullYear(),m=now.getMonth();
  var td=today(),yd=yesterday();
  var DN=['пн','вт','ср','чт','пт','сб','вс'];
  var ydO=new Date();ydO.setDate(ydO.getDate()-1);
  function q(v,num,l){
    var on=qaDate===v;
    return '<button type="button" class="cq-b'+(on?' on':'')+'" onclick="setQD(\''+v+'\')" aria-pressed="'+(on?'true':'false')+'"><span class="cq-n">'+num+'</span>'+l+(on?SV(IP.check,16,2.8):'')+'</button>';
  }
  var h='<div class="pop" onclick="event.stopPropagation()" role="dialog" aria-label="День траты">'+
    '<div class="cq">'+q('yesterday',ydO.getDate(),'Вчера')+q('today',now.getDate(),'Сегодня')+'</div>'+
    '<div class="cmonth">'+MN_NOM[m]+' '+y+'</div><div class="cgrid">';
  for(var di=0;di<7;di++)h+='<div class="cdh">'+DN[di]+'</div>';
  var first=new Date(y,m,1).getDay();first=first===0?6:first-1;
  var dim=new Date(y,m+1,0).getDate();
  for(var bl=0;bl<first;bl++)h+='<div></div>';
  for(var dd=1;dd<=dim;dd++){
    var ds=y+'-'+String(m+1).padStart(2,'0')+'-'+String(dd).padStart(2,'0');
    var isTd=ds===td,isFut=ds>td;
    var isSel=(qaDate==='custom'&&qaCustom===ds)||(qaDate==='today'&&isTd)||(qaDate==='yesterday'&&ds===yd);
    h+='<button type="button" class="cday'+(isTd?' ctd':'')+(isSel?' csel':'')+'"'+
      (isFut?' disabled':' onclick="pickDay(\''+ds+'\')"')+'>'+dd+'</button>';
  }
  return h+'</div></div>';
}

/* Список категорий для строки ввода. Показываем остаток по каждой —
   это ровно то, что нужно знать в момент выбора. */
/* ── Выбор категории: выпадает под чипом, остаток видно сразу ── */
function rCatPop(b){
  function opt(v,ico,nm,am,cls){
    var sel=qaSelVal===v;
    return '<button type="button" class="opt'+(sel?' sel':'')+'" onclick="pickCat(\''+v+'\')" role="menuitemradio" aria-checked="'+(sel?'true':'false')+'">'+
      ico+'<span class="opt-n">'+nm+'</span>'+
      '<span class="opt-a '+cls+'">'+am+'</span>'+
      '<span class="opt-k">'+(sel?SV(IP.check,18,2.8):'')+'</span></button>';
  }
  var db=calcDayBal(b);
  var rows=opt('',ICO_DAY(),'Дневные расходы',(db<0?'−':'')+fmt(Math.abs(db)),db>=0?'gd':'rd');
  for(var i=0;i<b.planned.length;i++){
    var p=b.planned[i],rem=calcCatRem(b,p.id);
    rows+=opt('p:'+p.id,ICO(p.emoji||'📌'),esc(p.name),(rem<0?'−':'')+fmt(Math.abs(rem)),rem>0?'gd':(rem<0?'rd':'mt'));
  }
  return '<div class="pop" onclick="event.stopPropagation()" role="menu" aria-label="Категория траты">'+rows+'</div>';
}

/* ── СВОДКА ЗА ПЕРИОД ──────────────────────────
   Бюджет живёт месяцами, но вопрос «сколько всего ушло на машину за год»
   в месячную рамку не помещается. Здесь считаем сквозь все периоды.
   Категории сопоставляем по названию: id у них в каждом месяце новые. */
var statRange='3m';   /* cur | 3m | 12m | all */
var statOpen='';      /* имя раскрытой категории в сводке */
var _statArr=[];      /* строки последней отрисовки: номер кнопки → категория */

function statBounds(){
  var t=today(), d=new Date(t+'T00:00:00');
  if(statRange==='cur'){
    var b=getAB();
    return b?{from:b.dateFrom,to:b.dateTo,label:fmtSh(b.dateFrom)+' — '+fmtSh(b.dateTo)}:{from:t,to:t,label:''};
  }
  if(statRange==='all'){
    var min=t;
    for(var i=0;i<S.txs.length;i++)if(S.txs[i].date<min)min=S.txs[i].date;
    return {from:min,to:t,label:'с '+fmtSh(min)};
  }
  var months=statRange==='12m'?12:3;
  d.setMonth(d.getMonth()-months);d.setDate(d.getDate()+1);
  var f=localISO(d);
  return {from:f,to:t,label:fmtSh(f)+' — '+fmtSh(t)};
}

function rStats(){
  var R=statBounds();
  var map={},total=0;
  for(var i=0;i<S.txs.length;i++){
    var tx=S.txs[i];
    if(tx.date<R.from||tx.date>R.to)continue;
    var key=tx.category||'Дневные расходы';
    var em=tx.category?(tx.categoryEmoji||'📌'):'🗓';
    if(!map[key])map[key]={name:key,emoji:em,sum:0,n:0,txs:[]};
    map[key].sum+=tx.amount;map[key].n++;map[key].txs.push(tx);
    total+=tx.amount;
  }
  var arr=[];for(var k in map)arr.push(map[k]);
  arr.sort(function(a,c){return c.sum-a.sum;});
  /* Раскрытая категория запоминается по имени, кнопка передаёт номер строки */
  _statArr=arr;
  /* Доход — из бюджетов, целиком попавших в интервал */
  var inc=0,nb=0;
  for(var j=0;j<S.budgets.length;j++){
    var bd=S.budgets[j];
    if(bd.dateFrom>=R.from&&bd.dateTo<=R.to){
      nb++;
      for(var q=0;q<bd.incomes.length;q++)inc+=bd.incomes[q].amount;
    }
  }
  var seg='';
  var opts=[['cur','Период'],['3m','3 месяца'],['12m','Год'],['all','Всё время']];
  for(var c=0;c<opts.length;c++){
    var on=statRange===opts[c][0];
    seg+='<button type="button" class="'+(on?'on':'')+'" role="tab" aria-selected="'+(on?'true':'false')+'" onclick="setRange(\''+opts[c][0]+'\')">'+opts[c][1]+'</button>';
  }
  var max=arr.length?arr[0].sum:1;
  var rows='';
  for(var r=0;r<arr.length;r++){
    var it=arr[r],pct=Math.round(it.sum/max*100),share=total>0?Math.round(it.sum/total*100):0;
    var open=statOpen===it.name;
    var det='';
    if(open){
      /* Порядок как на «Выписке»: свежее сверху, внутри дня — по seq */
      var list=it.txs.slice().sort(function(a,c){
        return c.date.localeCompare(a.date)||((c.seq||0)-(a.seq||0));});
      for(var q2=0;q2<list.length;q2++){
        det+='<div class="sd-row">'+
          '<span class="sd-dt">'+fmtSh(list[q2].date)+'</span>'+
          '<span class="sd-nm">'+esc(list[q2].name)+'</span>'+
          '<span class="sd-am">'+fmt(list[q2].amount)+'</span>'+
        '</div>';
      }
      det='<div class="sd">'+det+'</div>';
    }
    rows+='<div class="st-row">'+
      '<button type="button" class="tx" aria-expanded="'+(open?'true':'false')+'" onclick="togStat('+r+')">'+
        ICO(it.emoji)+
        '<span class="tx-t"><span class="nm">'+esc(it.name)+'</span>'+
          '<span class="mini ac"><i style="width:'+pct+'%"></i></span>'+
          '<span class="sub">'+share+'% · '+it.n+'&nbsp;'+plurOps(it.n)+'</span></span>'+
        '<span class="am">'+fmt(it.sum)+'</span>'+
        '<span class="st-ar'+(open?' up':'')+'">'+SV(IP.chev,16,2.6)+'</span>'+
      '</button>'+det+
    '</div>';
  }
  var diff=inc-total;
  return '<div class="seg" role="tablist" aria-label="Интервал" style="margin-top:4px">'+seg+'</div>'+
    '<section class="hero">'+
      '<div class="hero-top"><span>Потрачено</span><span>'+esc(R.label)+'</span></div>'+
      '<div class="big">'+fmt(total)+'</div>'+
      (nb?'<div class="pills two">'+
        '<div class="pill"><span>Доход за '+nb+'&nbsp;'+plurPeriods(nb)+'</span><b class="gd">'+fmt(inc)+'</b></div>'+
        '<div class="pill"><span>Разница</span><b class="'+(diff>=0?'gd':'rd')+'">'+(diff>=0?'':'−')+fmt(Math.abs(diff))+'</b></div>'+
      '</div>':'')+
    '</section>'+
    '<div class="dh"><span class="dh-t">По категориям</span></div>'+
    (arr.length?'<section class="grp">'+rows+'</section>':'<div class="grp"><div class="no-tx">За этот интервал трат нет</div></div>');
}
/* Русское склонение в одном месте. Раньше эта же логика была написана
   дважды — для операций и для дней; третий вызов (для трат) заставил бы
   написать её в третий раз. */
function plural(n,one,few,many){
  var a=n%100,b=n%10;
  if(a>4&&a<21)return many;
  if(b===1)return one;
  if(b>1&&b<5)return few;
  return many;
}
function plurOps(n){return plural(n,'операция','операции','операций');}
function plurPeriods(n){var a=n%100,b=n%10;if(a>4&&a<21)return 'периодов';if(b===1)return 'период';if(b>1&&b<5)return 'периода';return 'периодов';}

/* ── HISTORY TAB ─────────────────────────────── */
function rHistory(b){
  /* Группируем сразу, без предварительной сортировки всего массива */
  var txs=S.txs.filter(function(t){return t.budgetId===b.id;});
  var g={};
  for(var i=0;i<txs.length;i++){var tx=txs[i];(g[tx.date]||(g[tx.date]=[])).push(tx);}
  var dates=Object.keys(g).sort();dates.reverse();
  for(var di=0;di<dates.length;di++)g[dates[di]].sort(function(a,c){return (c.seq||0)-(a.seq||0);});

  /* Чипы под строкой ввода всегда показывают, куда и на какой день уйдёт
     трата. День не сбрасывается после записи: так удобно внести несколько
     трат за вчера подряд — а подсвеченный чип не даёт об этом забыть. */
  var notToday=qaDate!=='today';
  var dLbl=qaDate==='today'?'Сегодня':qaDate==='yesterday'?'Вчера, '+_DF_SH.format(new Date(yesterday()+'T00:00:00')):(qaCustom?fmtSh(qaCustom):'Дата');
  var cLbl='Дневные', cIco=ICO_DAY('sm'), cRem=calcDayBal(b);
  if(qaSelVal&&qaSelVal.indexOf('p:')===0){
    var cp=b.planned.filter(function(x){return x.id===qaSelVal.slice(2);})[0];
    if(cp){cLbl=cp.name;cIco=ICO(cp.emoji||'📌','sm');cRem=calcCatRem(b,cp.id);}else{qaSelVal='';}
  }
  var h=rHero(b)+
  '<div class="qa">'+
    '<div class="ask">'+
      '<input class="ask-in" id="qa-inp" placeholder="350 кофе" autocomplete="off" enterkeyhint="done" aria-label="Сумма и описание траты" value="'+esc(qaVal)+'" oninput="qaVal=qaAutoCap(this);updQAHint()">'+
      '<button type="button" class="ask-go" id="qa-go" onclick="doQA()" aria-label="Записать трату">'+SV(IP.up,20,2.6)+'</button>'+
    '</div>'+
    '<div class="qa-meta">'+
      (b.planned.length
        ? '<button type="button" class="qchip qc-cat'+(catPick?' open':'')+'" onclick="togCat(event)" aria-haspopup="menu" aria-expanded="'+(catPick?'true':'false')+'" aria-label="Категория: '+esc(cLbl)+'. Изменить">'+
            cIco+'<span class="qc-t">'+esc(cLbl)+'</span><b class="qc-a '+(cRem<0?'rd':'')+'">'+(cRem<0?'−':'')+fmt(Math.abs(cRem))+'</b>'+SV(IP.chev,14,2.6)+'</button>'
        : '<span style="flex:1"></span>')+
      '<button type="button" class="qchip qc-day'+(notToday?' hot':'')+(qaDrop?' open':'')+'" onclick="togCal(event)" aria-haspopup="dialog" aria-expanded="'+(qaDrop?'true':'false')+'" aria-label="День: '+dLbl+'. Изменить">'+
        SV(IP.cal,16,2.2)+'<span class="qc-t">'+dLbl+'</span>'+SV(IP.chev,14,2.6)+'</button>'+
      (catPick?rCatPop(b):'')+
      (qaDrop?rCalPop():'')+
    '</div>'+
    '<div class="ask-hint" id="qa-hint" aria-live="polite"></div>'+
  '</div>';

  if(!dates.length){
    return h+'<div class="grp" style="margin-top:22px"><div class="no-tx">Расходов пока нет — хорошее начало. Напиши «350 кофе» и нажми стрелку.</div></div>';
  }
  var td=today(),yd=yesterday();
  for(var di2=0;di2<dates.length;di2++){
    var date=dates[di2],dt=g[date],sum=0;
    for(var si=0;si<dt.length;si++)sum+=dt[si].amount;
    var dObj=new Date(date+'T00:00:00');
    var head=date===td?'Сегодня':date===yd?'Вчера':WD_NOM[dObj.getDay()];
    h+='<div class="dh"><span class="dh-t">'+head+'<small>'+_DF_LONG.format(dObj)+'</small></span><span class="dh-s">'+fmt(sum)+'</span></div>'+
      '<div class="grp">';
    for(var ti2=0;ti2<dt.length;ti2++){
      var t2=dt[ti2];
      var isDay=!t2.plannedCatId;
      /* Вся строка — кнопка правки. Высота фиксирована, при нажатии меняется
         только фон: ничего не сдвигается. Если палец поехал — это прокрутка,
         правка не откроется. */
      h+='<button type="button" class="tx'+(t2.id===freshTx?' fresh':'')+'" onclick="editTx(\''+t2.id+'\')">'+
        (isDay?ICO_DAY():ICO(t2.categoryEmoji||'📌'))+
        '<span class="tx-t"><span class="nm">'+esc(t2.name)+'</span>'+
          '<span class="sub">'+(isDay?'Дневные':esc(t2.category))+'</span></span>'+
        '<span class="am">'+fmt(t2.amount)+'</span>'+
      '</button>';
    }
    h+='</div>';
  }
  return h;
}
/* Подсказка под строкой ввода: как поняли запись и что станет с остатком.
   Только показ — считает теми же функциями, что и экран. */
function updQAHint(){
  var el=document.getElementById('qa-hint');if(!el)return;
  var inp=document.getElementById('qa-inp');var raw=inp?inp.value:'';
  var p=raw.trim()?parseQA(raw):null;
  var b=getAB();
  if(!p||!p.amount||!b){el.innerHTML='';return;}
  var left;
  if(qaSelVal&&qaSelVal.indexOf('p:')===0){
    var id=qaSelVal.slice(2),c=b.planned.filter(function(x){return x.id===id;})[0];
    if(c)left=calcCatRem(b,id)-p.amount;
  }
  if(left===undefined)left=calcDayBal(b)-p.amount;
  el.innerHTML='<span>«'+esc(p.name)+'» · <b>'+fmt(p.amount)+'</b></span>'+
    '<span>останется <b class="'+(left<0?'rd':'gd')+'">'+(left<0?'−':'')+fmt(Math.abs(left))+'</b></span>';
}
/* Всплывашка «записано · отменить». Живёт в body, перерисовки её не трогают. */
function showToast(html,undoId){
  var old=document.getElementById('toast');if(old)old.remove();
  var el=document.createElement('div');
  el.id='toast';el.className='toast';el.setAttribute('role','status');
  el.innerHTML='<span class="toast-t">'+html+'</span>'+
    (undoId?'<button type="button" class="toast-u" onclick="undoTx(\''+undoId+'\')">Отменить</button>':'');
  document.body.appendChild(el);
  clearTimeout(showToast._t);
  showToast._t=setTimeout(function(){var e=document.getElementById('toast');if(e)e.remove();},4500);
}

/* ── КАРТОЧКА ДНЯ ──────────────────────────────
   Главный экран должен за секунду отвечать на один вопрос:
   сколько я ещё могу потратить сегодня. Всё остальное — ниже. */
/* ── КАРТОЧКА ДНЯ ──────────────────────────────
   За секунду отвечает на один вопрос: сколько ещё можно потратить сегодня. */
function rHero(b){
  var bal=calcDayBal(b), pos=bal>=0;
  var td=today();
  /* Два разных числа: `spentToday` — только дневные траты (из них полоса),
     `catToday` — сегодняшние траты по плановым категориям. Не сливать. */
  var spentToday=0,catToday=0;
  for(var i=0;i<S.txs.length;i++){
    var t=S.txs[i];
    if(t.budgetId!==b.id||t.date!==td)continue;
    if(t.plannedCatId)catToday+=t.amount;else spentToday+=t.amount;
  }
  /* Полоса — остаток, как топливо в баке: утром полная, убывает с тратами.
     В минусе — красная на всю ширину: флаг «вышел из бюджета». */
  var startOfDay=bal+spentToday;
  var remPct=!pos?0:(startOfDay>0?Math.max(0,Math.min(100,Math.round(bal/startOfDay*100))):100);
  var left=daysBw(td,b.dateTo);
  var ended=b.dateTo<td;
  function pill(l,v,cls){return '<div class="pill"><span>'+l+'</span><b'+(cls?' class="'+cls+'"':'')+'>'+v+'</b></div>';}

  /* Период ещё не начался: другой вопрос — сколько всего и когда включится */
  if(b.dateFrom>td){
    var till=daysBw(td,b.dateFrom), days=getDays(b.dateFrom,b.dateTo);
    return '<section class="hero" aria-label="Будущий бюджет">'+
      '<div class="hero-top"><span>Всего в бюджете</span>'+
        '<span>'+(till>1?'начнётся через '+till+' '+plurDays(till):'начнётся завтра')+'</span></div>'+
      '<div class="big gd">'+fmt(calcTotalBal(b))+'</div>'+
      '<div class="bar"><i style="width:100%"></i></div>'+
      '<div class="pills two">'+pill('В день',fmt(b.dailyBudget))+pill('Дней в периоде',String(days))+'</div>'+
    '</section>';
  }
  var tail=ended?'период закрыт':left>0?left+' '+plurDays(left)+' до конца':'последний день';
  var tomorrow=bal+b.dailyBudget;
  return '<section class="hero" aria-label="'+(ended?'Итог периода':'Осталось на сегодня')+'">'+
    '<div class="hero-top"><span>'+(ended?'Итог периода':'Осталось на сегодня')+'</span><span>'+tail+'</span></div>'+
    '<div class="big '+(pos?'gd':'rd')+'">'+(pos?'':'−')+fmt(Math.abs(bal))+'</div>'+
    '<div class="bar" role="img" aria-label="'+(pos?'Дневной запас: осталось '+remPct+'%':'Вышел из дневного бюджета')+'"><i class="'+(pos?'':'rd')+'" style="width:'+(pos?remPct:100)+'%"></i></div>'+
    '<div class="pills'+(ended?' two':'')+'">'+
      pill('Потрачено',fmt(spentToday))+
      pill('По категориям',fmt(catToday))+
      (ended?'':(pos
        ? pill('Завтра','+'+fmt(b.dailyBudget),'gd')
        : pill('Завтра будет',(tomorrow<0?'−':'')+fmt(Math.abs(tomorrow)),tomorrow<0?'rd':'')))+
    '</div>'+
    (!pos&&!ended?'<div class="note rd">'+SV(IP.alert,16,2.4)+'<span>Перерасход <b>'+fmt(-bal)+'</b> спишется с завтрашней нормы '+fmt(b.dailyBudget)+'</span></div>':'')+
    (!ended&&!b.dailyBudget?'<div class="note">'+SV(IP.alert,16,2.4)+'<span>Дневных до конца периода не осталось</span></div>':'')+
  '</section>';
}
function plurDays(n){return plural(n,'день','дня','дней');}

/* ── INCOMES TAB ─────────────────────────────── */
function rIncomes(b){
  var ti=0;for(var i=0;i<b.incomes.length;i++)ti+=b.incomes[i].amount;
  var totalBal=calcTotalBal(b);
  var cashBal=calcCashBal(b), pend=incPending(b), td=today();
  var pct=ti>0?Math.max(0,Math.min(100,totalBal/ti*100)):0;
  function row(l,v,cls){return '<div class="kv"><span>'+l+'</span><b'+(cls?' class="'+cls+'"':'')+'>'+v+'</b></div>';}
  /* «На картах сейчас» — только когда есть чего ждать; без ожидаемых
     поступлений это то же число, что и общий остаток */
  var cash='';
  if(pend.length){
    var run=cashBal;
    cash=row('На картах сейчас',fmt(cashBal),cashBal>=0?'gd':'rd');
    for(var p=0;p<pend.length;p++){
      run+=pend[p].amount;
      cash+='<div class="kv pend"><span>'+fmtSh(pend[p].date)+' · '+esc(pend[p].name)+'</span><b>+'+fmt(pend[p].amount)+' → '+fmt(run)+'</b></div>';
    }
  }
  var rows='';
  for(var k=0;k<b.incomes.length;k++){
    var inc=b.incomes[k];
    var waits=inc.date&&inc.date>td;
    rows+='<button type="button" class="tx'+(waits?' wait':'')+'" onclick="editInc(\''+inc.id+'\')">'+
      ICO(inc.emoji||'💰')+
      '<span class="tx-t"><span class="nm">'+esc(inc.name)+'</span>'+
        (inc.date?'<span class="sub'+(waits?' ac':'')+'">'+(waits?'придёт ':'пришёл ')+fmtSh(inc.date)+'</span>':'')+'</span>'+
      '<span class="am">'+(inc.recur?REP():'')+fmt(inc.amount)+'</span>'+
    '</button>';
  }
  return '<section class="hero" aria-label="Общий остаток">'+
      '<div class="hero-top"><span>Общий остаток</span><span>до '+fmtSh(b.dateTo)+'</span></div>'+
      '<div class="big md '+(totalBal>=0?'gd':'rd')+'">'+(totalBal<0?'−':'')+fmt(Math.abs(totalBal))+'</div>'+
      '<div class="bar" role="img" aria-label="Осталось '+Math.round(pct)+'% дохода"><i style="width:'+pct.toFixed(1)+'%"></i></div>'+
      '<div class="kvs">'+
        cash+
        row('Всего доходов',fmt(ti),'gd')+
        row('Потрачено всего','−'+fmt(ti-totalBal))+
        row('Дневной бюджет',fmt(b.dailyBudget)+' / день')+
      '</div>'+
    '</section>'+
    '<div class="dh"><span class="dh-t">Источники<small>'+fmt(ti)+'</small></span>'+
      '<button type="button" class="btn bp sm" onclick="om(\'add-income\')">'+SV(IP.plus,16,2.8)+'Добавить</button></div>'+
    (b.incomes.length?'<div class="grp">'+rows+'</div>':'<div class="grp"><div class="no-tx">Доходов пока нет</div></div>');
}

/* ── PLANNED TAB ─────────────────────────────── */
function rPlanned(b){
  var ov=hasOv(b);
  var tot=0,sumRem=0;
  for(var j=0;j<b.planned.length;j++){tot+=b.planned[j].amount;sumRem+=calcCatRem(b,b.planned[j].id);}
  var rows='',ovList='';
  for(var k=0;k<b.planned.length;k++){
    var p=b.planned[k],rem=calcCatRem(b,p.id),neg=rem<0;
    var w=p.amount>0?Math.max(0,Math.min(100,rem/p.amount*100)):0;
    if(neg)ovList+='<button type="button" class="ov-btn" onclick="openTr(\''+p.id+'\')">Покрыть «'+esc(p.name)+'»</button> ';
    rows+='<button type="button" class="tx" onclick="editPln(\''+p.id+'\')">'+
      ICO(p.emoji||'📌')+
      '<span class="tx-t"><span class="nm">'+esc(p.name)+'</span><span class="mini"><i style="width:'+w.toFixed(1)+'%"></i></span></span>'+
      '<span class="amc">'+
        '<span class="am '+(neg?'rd':(rem>0?'gd':'mt'))+'">'+(p.recur?REP():'')+(neg?'−':'')+fmt(Math.abs(rem))+'</span>'+
        '<span class="of">'+(neg?'перерасход из '+fmt(p.amount):'из '+fmt(p.amount))+cmpPrev(b,p)+'</span>'+
      '</span>'+
    '</button>';
  }
  var ti=0;for(var q=0;q<b.incomes.length;q++)ti+=b.incomes[q].amount;
  /* По факту, а не по лимитам: перерасход тоже съедает дневные */
  var tp=ti-potOf(b);
  var pct=tot>0?Math.max(0,Math.min(100,sumRem/tot*100)):0;
  return '<section class="hero" aria-label="Остаток по категориям">'+
      '<div class="hero-top"><span>Осталось в категориях</span><span>лимит '+fmt(tot)+'</span></div>'+
      '<div class="big md'+(sumRem<0?' rd':'')+'">'+(sumRem<0?'−':'')+fmt(Math.abs(sumRem))+'</div>'+
      '<div class="bar" role="img" aria-label="Осталось '+Math.round(pct)+'% лимитов"><i style="width:'+pct.toFixed(1)+'%"></i></div>'+
    '</section>'+
    (ov?'<div class="warn">'+
      '<div class="warn-t">Есть категории с перерасходом</div>'+
      '<div class="warn-s">Покрой перерасход из дневного бюджета или другой категории.</div>'+ovList+
    '</div>':'')+
    /* Планы съели весь доход — норма обнулилась. Говорим прямо. */
    (tp>ti?'<div class="warn">'+
      '<div class="warn-t">Планы превышают доход на '+fmt(tp-ti)+'</div>'+
      '<div class="warn-s">Дневной бюджет обнулён — на ежедневные траты денег не осталось. Уменьши лимиты категорий или добавь доход.</div>'+
    '</div>':'')+
    '<div class="dh"><span class="dh-t">Категории</span><span class="dh-acts">'+
      (b.planned.length?'<button type="button" class="ib" onclick="openTr(\'\')" aria-label="Перевести между категориями">'+SV(IP.swap,20,2.2)+'</button>':'')+
      '<button type="button" class="btn bp sm" onclick="om(\'add-planned\')">'+SV(IP.plus,16,2.8)+'Добавить</button>'+
    '</span></div>'+
    (b.planned.length?'<div class="grp">'+rows+'</div>':'<div class="grp"><div class="no-tx">Категорий пока нет</div></div>')+
    rTopSpend(b);
}

/* Топ трат за период. Показываем только когда есть что показывать —
   на пустом бюджете карточка не мозолит глаза. */
/* Топ трат за период — только когда есть что показывать */
function rTopSpend(b){
  var top=getTopSpend(b,3);
  if(!top.length)return '';
  var spent=getTotalSpent(b);
  var ti=0;for(var q=0;q<b.incomes.length;q++)ti+=b.incomes[q].amount;
  var ended=b.dateTo<today();
  var max=top[0].amount||1;
  var rows='';
  for(var i=0;i<top.length;i++){
    var it=top[i],pct=Math.round(it.amount/max*100);
    var share=spent>0?Math.round(it.amount/spent*100):0;
    rows+='<div class="tx">'+
      ICO(it.emoji)+
      '<span class="tx-t"><span class="nm">'+(i+1)+'. '+esc(it.name)+'</span>'+
        '<span class="mini ac"><i style="width:'+pct+'%"></i></span>'+
        '<span class="sub">'+share+'% всех трат'+(it.limit!==null?' · лимит '+fmt(it.limit):'')+'</span></span>'+
      '<span class="am">'+fmt(it.amount)+'</span>'+
    '</div>';
  }
  return '<div class="dh"><span class="dh-t">'+(ended?'Итоги периода':'Топ трат')+'</span>'+
    '<span class="dh-s">'+fmt(spent)+(ti>0?' из '+fmt(ti):'')+'</span></div>'+
    '<div class="grp">'+rows+'</div>';
}

  if(m.type==='add-income'||m.type==='edit-income'){

    body=hd(m.type==='add-income'?'Добавить доход':'Изменить доход')+
      amt('Сумма, ₽','fmtInp(this)',nf(d.amount||''))+
      sgs(IC)+
      icoRow(d.emoji||'💰',d.name,'Зарплата','Название')+

/* ── PLANNED PREVIEW ─────────────────────────── */
function updPlnPrev(rawVal){
  var el=document.getElementById('pln-prev');if(!el)return;
  var ti=0;for(var i=0;i<_pc.inc.length;i++)ti+=_pc.inc[i].amount;
  var tp=0;for(var j=0;j<_pc.pln.length;j++){if(_pc.pln[j].id!==_pc.eid)tp+=_pc.pln[j].amount;}
  var newAmt=pf(rawVal);tp+=newAmt;
  var newD=Math.max(0,(ti-tp)/_pc.days);
  /* Точная подсказка: тот же recalcDaily на копии бюджета. Формула «(доходы −
     планы) / все дни» расходится с нормой у бюджета, заведённого не с 1-го,
     и в середине периода, где ставка сводится с уже начисленным. */
  if(_pc.b){
    var cb=JSON.parse(JSON.stringify(_pc.b)), hit=false;
    for(var k=0;k<cb.planned.length;k++)if(cb.planned[k].id===_pc.eid){cb.planned[k].amount=newAmt;hit=true;}
    if(!hit)cb.planned.push({id:'__prev__',name:'',amount:newAmt});
    recalcDaily(cb);newD=cb.dailyBudget;
  }
  var diff=newD-_pc.curD;
  var col=diff>=0?'var(--gd)':'var(--rd)';
  el.innerHTML='Дневной бюджет: <b>'+fmt(newD)+'</b> <span style="color:'+col+';">'+(diff>=0?'+':'−')+fmt(Math.abs(diff))+'/день</span>';
}

/* ── TRANSFER PREVIEW ────────────────────────── */
function updTrPrev(){
  var el=document.getElementById('tr-prev');if(!el)return;
  var fid=(document.getElementById('mf')||{}).value||'';
  var tid=(document.getElementById('mt')||{}).value||'';
  var amt=pf((document.getElementById('ma')||{}).value);
  if(!amt||fid===tid){el.innerHTML='';return;}
  function getRem(id){
    if(!id)return _trCtx.dayBal;
    var a=_trCtx.pln.filter(function(p){return p.id===id;});if(!a.length)return 0;
    var sp=0;for(var i=0;i<S.txs.length;i++){var tx=S.txs[i];if(tx.budgetId===_trCtx.bid&&tx.plannedCatId===id)sp+=tx.amount;}
    return a[0].amount-sp;
  }
  function getName(id){
    if(!id)return 'Дневной бюджет';
    var a=_trCtx.pln.filter(function(p){return p.id===id;});return a.length?(a[0].emoji||'')+' '+a[0].name:'';
  }
  var fC=getRem(fid),fN=fC-amt,tC=getRem(tid),tN=tC+amt;
  var rows='<div class="trprow"><span>'+esc(getName(fid))+'</span><span>'+fmt(fC)+' → <b style="color:'+(fN<0?'var(--rd)':'var(--gd)')+'">'+fmt(fN)+'</b></span></div>';
  rows+='<div class="trprow"><span>'+esc(getName(tid))+'</span><span>'+fmt(tC)+' → <b style="color:'+(tN<0?'var(--rd)':'var(--gd)')+'">'+fmt(tN)+'</b></span></div>';
  /* Когда деньги берутся из дневного бюджета — сразу показываем цену решения
     в понятных единицах: на сколько похудеет каждый оставшийся день */
  var bb=getAB();
  if(bb&&(!fid||!tid)){
    var t=today();
    var leftDays=t>bb.dateTo?0:getDays(t>bb.dateFrom?t:bb.dateFrom,bb.dateTo);
    if(leftDays>0){
      var per=amt/leftDays, up=!fid;   /* берём из дневного → норма падает */
      rows+='<div class="trprow trpday"><span>Дневная норма</span><span>'+
        fmt(bb.dailyBudget)+' → <b style="color:'+(up?'var(--rd)':'var(--gd)')+'">'+
        fmt(bb.dailyBudget+(up?-per:per))+'</b></span></div>';
    }
  }
  el.innerHTML='<div class="trpbox">'+rows+'</div>';
}

/* Перенос числа месяца в новый период: 10-е остаётся 10-м. Берём первое
   вхождение этого числа внутрь периода. Период может начинаться 15-го —
   тогда «10-е» относится уже к следующему месяцу; период может быть и
   длиннее месяца, поэтому идём до его конца, а не фиксированные два шага.
   Потолок в 24 месяца — страховка от бесконечного цикла на кривых датах. */
function shiftDOM(date,from,to){
  if(!date||from>to)return '';
  var dom=+date.slice(8,10), f=new Date(from+'T00:00:00');
  for(var k=0;k<24;k++){
    var y=f.getFullYear(), m=f.getMonth()+k;
    var first=localISO(new Date(y,m,1));
    if(first>to)break;
    var last=new Date(y,m+1,0).getDate();
    if(dom<=last){
      var cand=localISO(new Date(y,m,dom));
      if(cand>=from&&cand<=to)return cand;
    }
  }
  return '';
}

/* ── WIZARD ──────────────────────────────────── */
function initWD(){
  var now=new Date(),y=now.getFullYear(),m=now.getMonth();
  /* Умный выбор месяца:
     - текущий месяц не покрыт бюджетом → предлагаем текущий
     - покрыт → месяц после ПОСЛЕДНЕГО бюджета (по датам, не по порядку в массиве) */
  var sorted=S.budgets.slice().sort(function(a,c){return a.dateFrom.localeCompare(c.dateFrom);});
  var last=sorted.length?sorted[sorted.length-1]:null;
  if(last){
    var t=today();
    var curCovered=S.budgets.some(function(x){return x.dateFrom<=t&&x.dateTo>=t;});
    if(curCovered||last.dateFrom>t){
      /* берём месяц, следующий за последним бюджетом */
      var ld=new Date(last.dateTo+'T00:00:00');
      ld.setDate(ld.getDate()+1);
      y=ld.getFullYear();m=ld.getMonth();
    }
    /* иначе текущий месяц (y,m уже = сейчас) */
  }
  var df=firstDOM(y,m), dt=lastDOM(y,m);
  /* Если последний бюджет закончился в середине месяца — начинаем со следующего
     дня после него, а не с 1-го числа (иначе пересечение) */
  if(last&&df<=last.dateTo){
    var nd=new Date(last.dateTo+'T00:00:00');nd.setDate(nd.getDate()+1);
    df=localISO(nd);
    if(dt<df)dt=lastDOM(nd.getFullYear(),nd.getMonth());
  }
  /* Регулярные доходы (зарплата, аренда) переносят сумму — как и категории.
     Дата начисления переносится тем же числом месяца: аванс 10-го остаётся
     авансом 10-го. Если такого числа в новом периоде нет (период короче или
     начался позже) — дата снимается, и доход считается уже поступившим:
     это заметно на экране, в отличие от даты, тихо уехавшей на край месяца. */
  var inc=last?last.incomes.map(function(i){
    return{id:uid(),name:i.name,emoji:i.emoji,amount:i.recur?i.amount:'',recur:!!i.recur,
           date:i.recur?shiftDOM(i.date,df,dt):''};
  }) :[];
  /* Регулярные категории (ипотека, подписки) переносят сумму —
     их не надо вбивать заново каждый месяц. Остальные — пустые. */
  var pln=last?last.planned.map(function(p){return{id:uid(),name:p.name,emoji:p.emoji,amount:p.recur?p.amount:'',recur:!!p.recur};}) :[{id:uid(),name:'Непредвиденные расходы',emoji:'✨',amount:''}];
  if(!pln.filter(function(p){return p.name==='Непредвиденные расходы';}).length)
    pln.unshift({id:uid(),name:'Непредвиденные расходы',emoji:'✨',amount:''});
  return{dateFrom:df,dateTo:dt,showDates:false,incomes:inc,planned:pln};
}

function bindEmpty(){window.startWz=function(){tab='wizard';wizStep=0;wd=initWD();render();};}

function bindMain(b){
  window.setTab    =function(t){tab=t;drop=false;usrMenu=false;render();window.scrollTo(0,0);};
  window.openStats =function(){tab='stats';drop=false;render();window.scrollTo(0,0);};
  /* Смена интервала пересобирает список — раскрытая категория в нём может
     и не встретиться, поэтому раскрытие снимается вместе с интервалом. */
  window.setRange  =function(r){statRange=r;statOpen='';render();};

       Освободившаяся сумма из "планов" уходит в знаменатель recalcDaily,
       поэтому дневная норма поднимается сама, без ручного пересчёта. */
    p.amount-=rem;touch(p);   /* строка сливается сама — без метки правка уедет */

    plnMenu=null;
    save();render();

  window.closeModal=function(){modal=null;render();};
  window.ovClick   =function(e){if(e.target.classList.contains('overlay'))closeModal();};
  window.swBdg     =function(id){S.activeBudgetId=id;save();drop=false;render();};
  window.goCurrent =function(){var cb=getCurrentBudget();if(cb){S.activeBudgetId=cb.id;save();drop=false;render();}};
  window.newBdg    =function(){drop=false;tab='wizard';wizStep=0;wd=initWD();render();};
  window.openBdgEdit=function(){drop=false;modal={type:'budget-edit',data:{dateFrom:b.dateFrom,dateTo:b.dateTo}};render();};
  window.saveBdgDates=function(){
    var f=(document.getElementById('be-from')||{}).value, t=(document.getElementById('be-to')||{}).value;
    if(!f||!t){alert('Укажи обе даты');return;}
    if(f>t){alert('Дата начала позже даты конца');return;}
    for(var bi=0;bi<S.budgets.length;bi++){
      var ex=S.budgets[bi];
      if(ex.id===b.id)continue;
      if(f<=ex.dateTo&&t>=ex.dateFrom){
        alert('Период пересекается с бюджетом '+fmtSh(ex.dateFrom)+' — '+fmtSh(ex.dateTo));
        return;
      }
    }
    b.dateFrom=f;b.dateTo=t;
    /* Сузили период — дата прихода могла остаться снаружи. Гасим молча:

    clampIncDates(b);
    recalcDaily(b);save();modal=null;render();
  };
  window.delBdg=function(id){
    if(S.budgets.length<=1){alert('Нельзя удалить единственный бюджет');return;}

    ripEnt('bdg',id);
    S.budgets=S.budgets.filter(function(x){return x.id!==id;});

      if(t.budgetId===id){ripEnt('tx',t.id);return false;}

  function gQV(){return(document.getElementById('qa-inp')||{}).value||qaVal||'';}

  window.pickDay   =function(ds){var sv=gQV();qaCustom=ds;qaDate='custom';qaDrop=false;render();rQV(sv);};
  window.togCat    =function(e){e.stopPropagation();var v=gQV();catPick=!catPick;qaDrop=false;render();rQV(v);};
  window.pickCat   =function(v){var sv=gQV();qaSelVal=v;catPick=false;render();rQV(sv);};

  window.doQA=function(){
    var raw=((document.getElementById('qa-inp')||{}).value||qaVal||'').trim();
    qaVal=raw;
    var p=parseQA(raw);if(!p||!p.amount)return;
    var useDate=today();
    if(qaDate==='yesterday')useDate=yesterday();
    else if(qaDate==='custom'&&qaCustom)useDate=qaCustom;

      alert('Дата '+fmtSh(useDate)+' вне периода бюджета ('+fmtSh(b.dateFrom)+' — '+fmtSh(b.dateTo)+').');
      return;
    }
    if(useDate>today()){alert('Нельзя добавить трату будущей датой');return;}

      pcid=qaSelVal.slice(2);

      if(fc.length){cat=fc[0].name;cate=fc[0].emoji||'📌';}
    }
    var nid=uid();
    S.txs.push(touch({id:nid,seq:Date.now(),date:useDate,name:p.name,category:cat,categoryEmoji:cate,plannedCatId:pcid,amount:p.amount,budgetId:b.id}));
    qaVal='';qaSelVal='';/* сброс на «Дневные расходы» — как в Sintra */
    catPick=false;
    /* Подтверждение, что трата записалась: короткая вибрация, зелёная

    freshTx=nid;
    try{ if(navigator.vibrate)navigator.vibrate(12); }catch(e){}
    save();render();
    var go=document.getElementById('qa-go');
    if(go){go.classList.add('ok');go.innerHTML=SV(IP.check,20,2.8);
      setTimeout(function(){var g2=document.getElementById('qa-go');if(g2){g2.classList.remove('ok');g2.innerHTML=SV(IP.up,20,2.6);}},700);}
    showToast(esc(p.name)+' · <b>'+fmt(p.amount)+'</b> записано'+(useDate!==today()?' на '+fmtSh(useDate):''),nid);
    setTimeout(function(){ if(freshTx===nid){freshTx=null;} },1400);
  };

  window.om=function(type){
    if(type==='add-planned')_pc={b:b,inc:b.incomes,pln:b.planned,eid:'__new__',days:getDays(b.dateFrom,b.dateTo),curD:b.dailyBudget};

  window.fillSg=function(eid,ev,nid,nv){var a=document.getElementById(eid),c=document.getElementById(nid);if(a)a.value=ev;if(c)c.value=nv;};

  window.editInc=function(id){var i=b.incomes.filter(function(x){return x.id===id;})[0];incMenu=null;modal={type:'edit-income',data:Object.assign({},i)};render();};
  /* Метка удаления обязательна: без неё второе устройство вернёт строку
     обратно при первом же слиянии — она там ещё жива и с прежним mod. */
  window.delInc =function(id,ok){if(!ok&&!confirm('Удалить?'))return;incMenu=null;ripEnt('inc',id);b.incomes=b.incomes.filter(function(i){return i.id!==id;});recalcDaily(b);save();modal=null;render();};
  window.saveInc=function(){
    var n=((document.getElementById('mn')||{}).value||'').trim();
    var a=pf((document.getElementById('ma')||{}).value);

    if(!n||!a)return;
    var rc=!!(document.getElementById('mr')||{}).checked;
    /* Дата вне периода бессмысленна: этот доход относится к этому бюджету,
       и «придёт 5 ноября» в сентябрьском периоде ничего не значит.
       Пустая дата — штатный случай, а не ошибка: деньги уже на руках. */
    var dt=incDateFit(b,((document.getElementById('mdi')||{}).value||'').trim());
    /* touch на самой строке, а не только на бюджете: доходы сливаются
       поэлементно, и без метки правка проиграет чужой копии той же строки */
    if(modal.type==='add-income')b.incomes.push(touch({id:uid(),name:n,emoji:e,amount:a,recur:rc,date:dt}));
    else{var inc=b.incomes.filter(function(x){return x.id===modal.data.id;})[0];if(inc){inc.name=n;inc.emoji=e;inc.amount=a;inc.recur=rc;inc.date=dt;touch(inc);}}
    recalcDaily(b);save();modal=null;render();
  };

  window.editPln=function(id){
    var p=b.planned.filter(function(x){return x.id===id;})[0];plnMenu=null;
    _pc={b:b,inc:b.incomes,pln:b.planned,eid:id,days:getDays(b.dateFrom,b.dateTo),curD:b.dailyBudget};
    modal={type:'edit-planned',data:Object.assign({},p)};render();
  };
  window.delPln=function(id,ok){
    /* Считаем привязанные траты — они станут дневными, иначе сломается баланс */
    var linked=S.txs.filter(function(t){return t.budgetId===b.id&&t.plannedCatId===id;});
    var msg=linked.length
      ?'Удалить категорию? '+linked.length+' '+plural(linked.length,'трата','траты','трат')
        +' '+(linked.length===1?'перейдёт':'перейдут')+' в «Дневные расходы».'
      :'Удалить категорию?';
    if(!ok&&!confirm(msg))return;
    plnMenu=null;
    for(var i=0;i<S.txs.length;i++){
      var t=S.txs[i];
      /* touch обязателен: без метки второе устройство при равных mod оставит
         свою копию, привязанную к удалённой категории, и трата выпадет из
         счёта — ни в дневных, ни в категориях (+5 000 к «осталось», 24.09) */
      if(t.budgetId===b.id&&t.plannedCatId===id){t.plannedCatId=null;t.category='';t.categoryEmoji='';touch(t);}
    }
    ripEnt('pln',id);
    b.planned=b.planned.filter(function(p){return p.id!==id;});
    recalcDaily(b);save();modal=null;render();
  };
  window.savePln=function(){
    var n=((document.getElementById('mn')||{}).value||'').trim();
    var a=pf((document.getElementById('ma')||{}).value);
    var e=((document.getElementById('me')||{}).value||'✨').trim();
    if(!n||!a)return;
    var rc=!!(document.getElementById('mr')||{}).checked;
    if(modal.type==='add-planned')b.planned.push(touch({id:uid(),name:n,emoji:e,amount:a,recur:rc}));
    else{var pl=b.planned.filter(function(x){return x.id===modal.data.id;})[0];if(pl){pl.name=n;pl.emoji=e;pl.amount=a;pl.recur=rc;touch(pl);}}
    recalcDaily(b);save();modal=null;render();
  };

  window.openTr=function(fromId){
    plnMenu=null;
    var rem=calcCatRem(b,fromId),isOv=rem<0;
    var data=isOv
      ?{toId:fromId,preAmt:Math.abs(rem)}   // category is "to" (receiver), prefill deficit
      :{fromId:fromId,toId:'',preAmt:0};    // normal: category is "from"
    modal={type:'transfer',data:data};render();
  };
  window.doTr=function(){
    var errEl=document.getElementById('tr-err');
    function err(m){if(errEl)errEl.textContent=m;}
    var a=pf((document.getElementById('ma')||{}).value);
    if(!a)return err('Укажи сумму перевода');
    var fid=(document.getElementById('mf')||{}).value||'';
    var tid=(document.getElementById('mt')||{}).value||'';
    if(fid===tid)return err('Источник и получатель совпадают');
    /* Валидация источника:
       - Дневной бюджет (fid==='') — переводить можно всегда. Деньги берутся из
         месячного распределения, минус на сегодня не блокирует. Дневная норма
         пересчитается автоматически после перевода.
       - Категория (fid!=='') — только в пределах её положительного остатка. */
    if(fid){
      var rem=calcCatRem(b,fid);
      if(rem<=0)return err('В категории нет свободных средств');
      if(a>rem)return err('В категории только '+fmt(rem)+' — перевести '+fmt(a)+' нельзя');
    }
    if(fid){var cf=b.planned.filter(function(p){return p.id===fid;})[0];if(cf){cf.amount-=a;touch(cf);}}
    if(tid){var ct=b.planned.filter(function(p){return p.id===tid;})[0];if(ct){ct.amount+=a;touch(ct);}}
    recalcDaily(b);save();modal=null;render();
  };

  window.editTx=function(id){var tx=S.txs.filter(function(t){return t.id===id;})[0];txMenu=null;if(tx){modal={type:'edit-tx',data:Object.assign({},tx)};render();}};
  window.delTx =function(id,ok){if(!ok&&!confirm('Удалить трату?'))return;ripEnt('tx',id);S.txs=S.txs.filter(function(t){return t.id!==id;});txMenu=null;save();modal=null;render();};
  /* Удаление в два касания вместо системного confirm: первое касание
     «взводит» кнопку, второе удаляет. Через 3 секунды кнопка остывает. */
  window.armDel=function(btn,kind,id){
    if(!btn.classList.contains('armed')){
      btn.dataset.t=btn.textContent;btn.classList.add('armed');
      var msg='Нажми ещё раз — удалить';
      if(kind==='pln'){var n=S.txs.filter(function(t){return t.budgetId===b.id&&t.plannedCatId===id;}).length;
        if(n)msg='Ещё раз — удалить. '+n+' '+plural(n,'трата перейдёт','траты перейдут','трат перейдут')+' в дневные';}
      btn.textContent=msg;
      setTimeout(function(){if(btn.isConnected&&btn.classList.contains('armed')){btn.classList.remove('armed');btn.textContent=btn.dataset.t;}},3000);
      return;
    }
    if(kind==='tx')window.delTx(id,true);
    if(kind==='inc')window.delInc(id,true);
    if(kind==='pln')window.delPln(id,true);
  };
  /* «Отменить» во всплывашке после записи — обычное удаление этой траты */
  window.undoTx=function(id){
    var e=document.getElementById('toast');if(e)e.remove();
    if(!S.txs.some(function(t){return t.id===id;}))return;
    ripEnt('tx',id);S.txs=S.txs.filter(function(t){return t.id!==id;});freshTx=null;save();render();
  };
  window.saveTx=function(id){
    var tx=S.txs.filter(function(t){return t.id===id;})[0];if(!tx)return;
    /* Проверки ДО записи в трату: отклонённая правка не должна оставаться
       в памяти. Раньше сумма менялась первой, предупреждение о дате
       закрывало окно, а 9 999 уезжали в облако со следующим сохранением. */
    var nd=(document.getElementById('md')||{}).value||tx.date;
    if(nd>today()){alert('Нельзя ставить будущую дату');return;}
    if(nd<b.dateFrom||nd>b.dateTo){alert('Дата вне периода бюджета ('+fmtSh(b.dateFrom)+' — '+fmtSh(b.dateTo)+')');return;}
    tx.name=((document.getElementById('mn')||{}).value||'').trim()||tx.name;
    tx.amount=pf((document.getElementById('ma')||{}).value)||tx.amount;
    tx.date=nd;
    var cv=(document.getElementById('mc2')||{}).value||'';
    if(cv.startsWith('p:')){
      tx.plannedCatId=cv.slice(2);
      var c2=b.planned.filter(function(p){return p.id===tx.plannedCatId;})[0];
      if(c2){tx.category=c2.name;tx.categoryEmoji=c2.emoji||'📌';}
    }else{tx.plannedCatId=null;tx.category='';tx.categoryEmoji='';}
    touch(tx);
    save();modal=null;render();
  };

  setTimeout(function(){
    var qa=document.getElementById('qa-inp');
    if(qa)qa.addEventListener('keydown',function(e){if(e.key==='Enter')window.doQA();});
  },20);
}

function bindWiz(){
  window.wzTD =function(){wd.showDates=!wd.showDates;render();};
  window.wzDts=function(){

  window.wzTP =function(e,n){var i=wd.planned.findIndex(function(x){return x.name===n;});if(i>=0)wd.planned.splice(i,1);else wd.planned.push({id:uid(),name:n,emoji:e,amount:''});render();};
  window.wzAI =function(){wd.incomes.push({id:uid(),name:'',emoji:'💰',amount:''});render();};
  window.wzAP =function(){wd.planned.push({id:uid(),name:'',emoji:'✨',amount:''});render();};
  window.wzDI =function(i){wd.incomes.splice(i,1);render();};
  window.wzDP =function(i){wd.planned.splice(i,1);render();};
  window.wf   =function(arr,i,key,val){if(arr==='inc'&&wd.incomes[i])wd.incomes[i][key]=val;if(arr==='pln'&&wd.planned[i])wd.planned[i][key]=val;};
  window.updIT=function(){var ti=wdTI();var el=document.getElementById('wz-it');if(el)el.textContent=fmt(ti);var btn=document.getElementById('wz-next0');if(btn)btn.disabled=!(ti>0);};
  window.updPT=function(){
    var tp=wdTP(),ti=wdTI(),avail=ti-tp,days=wdAccDays(wd),daily=avail>0?avail/days:0;
    var el=document.getElementById('wz-pt');if(el)el.textContent=fmt(tp);
    var dl=document.getElementById('wz-dl');if(dl)dl.textContent=fmt(daily)+'/день';
  };
  window.wzN=function(step){
    if(step===0){
      var ti=wdTI(),pct=Math.round(ti*0.1);
      var ui=wd.planned.findIndex(function(p){return p.name==='Непредвиденные расходы';});
      if(ui>=0){if(!wd.planned[ui].amount||wd.planned[ui].amount===0)wd.planned[ui].amount=pct;}
      else wd.planned.unshift({id:uid(),name:'Непредвиденные расходы',emoji:'✨',amount:pct});
    }
    wizStep=step+1;render();
  };
  window.wzCr=function(){
    var d=wd,ti=wdTI(),tp=wdTP(),avail=ti-tp,days=getDays(d.dateFrom,d.dateTo);
    /* Проверка пересечения с существующими бюджетами */
    for(var bi=0;bi<S.budgets.length;bi++){
      var ex=S.budgets[bi];
      if(d.dateFrom<=ex.dateTo&&d.dateTo>=ex.dateFrom){
        alert('Период пересекается с бюджетом '+fmtSh(ex.dateFrom)+' — '+fmtSh(ex.dateTo)+'.\nИзмени даты.');
        return;
      }
    }
    days=wdAccDays(d);   /* норма — на дни начисления, см. accrualDays */
    var bdg={id:uid(),dateFrom:d.dateFrom,dateTo:d.dateTo,createdAt:today(),
      incomes:d.incomes.map(function(i){return touch(Object.assign({},i,{amount:pf(i.amount)||0}));}),
      planned:d.planned.map(function(p){return touch(Object.assign({},p,{amount:pf(p.amount)||0}));}),
      dailyBudget:avail>0?avail/days:0,
      pot:avail,potV:2,
      rates:[{from:d.dateFrom,v:avail>0?avail/days:0}]};
    /* Даты доходов посчитаны в initWD от ПЕРВОНАЧАЛЬНЫХ границ, а wzDts мог
       их потом подвинуть — тогда перенесённая дата оказывается за пределами
       только что созданного бюджета. Сводим по фактическим границам. */
    clampIncDates(bdg);
    S.budgets.push(touch(bdg));S.activeBudgetId=bdg.id;save();tab='history';wd=null;render();
  };
}

/* ── START ── */
initApp();


</script>
<script>
/* ── SERVICE WORKER ────────────────────────────
   Раньше `sw.js` лежал в репозитории, но никто его не подключал: регистрации
   не было ни в одном коммите с самого первого. Офлайн-режим и гонка
   «сеть против 2.5 секунд», описанные в самом sw.js, никогда не исполнялись —
   обновление приходило обычным HTTP-кэшем.

   Регистрируем после `load`, чтобы установка воркера не отнимала канал
   у первой отрисовки: на телефоне в метро это заметно.

   `controllerchange` + перезагрузка — иначе новая версия применяется только
   со второй перезагрузки: первая успевает отрисоваться из-под старого
   воркера, а новый лишь встаёт на его место. Но на ПЕРВОЙ установке
   `clients.claim()` тоже шлёт `controllerchange`, а страница в этот момент
   уже актуальна — поэтому перезагружаемся, только если контроллер БЫЛ. */
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function() {
    var hadController = !!navigator.serviceWorker.controller;
    var reloading = false;

    navigator.serviceWorker.addEventListener('controllerchange', function() {
      if (!hadController || reloading) return;
      reloading = true;
      location.reload();
    });

    navigator.serviceWorker.register('sw.js').then(function(reg) {
      /* Возврат на вкладку — повод проверить обновление: приложение с
         домашнего экрана может неделями не перезагружаться целиком,
         и без этого правка доедет неизвестно когда. */
      document.addEventListener('visibilitychange', function() {
        if (!document.hidden) reg.update();
      });
    }).catch(function() {
      /* Не установился — не беда: приложение работает и без него,
         просто без офлайна. Молчим, чтобы не пугать. */
    });
  });
}
</script>
